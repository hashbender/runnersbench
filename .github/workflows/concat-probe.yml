name: concat-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: luxor-ubuntu-medium-4c-8g
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - run: cd tools/concatbench && go build -o /tmp/concatbench .
      - name: ext4
        run: |
          uname -r; df -T /tmp | tail -1
          mkdir -p /tmp/ext4 && /tmp/concatbench /tmp/ext4 && rm -rf /tmp/ext4
      - name: zfs
        run: |
          sudo apt-get install -y -qq zfsutils-linux >/dev/null 2>&1 || true
          sudo modprobe zfs || { echo "no zfs module"; exit 0; }
          zfs version
          truncate -s 6G /tmp/zpool.img
          sudo zpool create -o ashift=12 -O compression=lz4 -O atime=off -O recordsize=1M probe /tmp/zpool.img
          sudo zpool get feature@block_cloning probe
          for v in 0 1; do
            echo "zfs_bclone_enabled=$v"
            echo $v | sudo tee /sys/module/zfs/parameters/zfs_bclone_enabled >/dev/null || echo "cannot set bclone"
            sudo mkdir -p /probe/run$v && sudo chmod 777 /probe/run$v
            /tmp/concatbench /probe/run$v
            sudo rm -rf /probe/run$v
          done
