name: apt probe
on: workflow_dispatch
jobs:
  lock:
    runs-on: luxor-ubuntu-medium-4c-8g
    strategy:
      fail-fast: false
      matrix:
        case: [update-default, install-default, update-timeout, install-timeout]
    steps:
      - name: Background refresh then immediate apt use
        run: |
          set -u
          apt-get --version | head -1
          if [[ "${{ matrix.case }}" == *-timeout ]]; then
            echo 'DPkg::Lock::Timeout "120";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout >/dev/null
          fi
          sudo systemd-run --quiet --unit=bg-apt-refresh --no-block --property=Nice=10 apt-get update -qq
          sleep 0.3
          s=$(date +%s%N)
          if [[ "${{ matrix.case }}" == update-* ]]; then
            sudo apt-get update -qq; rc=$?
          else
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fio; rc=$?
          fi
          echo "RESULT case=${{ matrix.case }} rc=$rc ms=$(( ($(date +%s%N)-s)/1000000 ))"
          systemctl status bg-apt-refresh --no-pager 2>&1 | head -5 || true
          journalctl -u bg-apt-refresh --no-pager 2>/dev/null | tail -5 || true
  timing:
    runs-on: luxor-ubuntu-medium-4c-8g
    steps:
      - name: Refresh at start, measure
        run: |
          s=$(date +%s%N)
          sudo systemd-run --quiet --unit=bg-apt-refresh --wait --property=Nice=10 apt-get update -qq
          echo "RESULT bg refresh ms=$(( ($(date +%s%N)-s)/1000000 ))"
          s=$(date +%s%N); sudo apt-get update -qq; echo "RESULT user update after refresh ms=$(( ($(date +%s%N)-s)/1000000 ))"
