name: apt-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: luxor-ubuntu-medium-4c-8g
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, pdiffs-off, fresh-lists]
        rep: [1, 2, 3]
    steps:
      - name: list age
        run: |
          now=$(date +%s)
          for f in /var/lib/apt/lists/*_InRelease; do
            d=$(sed -n 's/^Date: //p' "$f" | head -1)
            echo "$(( (now - $(date -d "$d" +%s)) / 3600 ))h $(basename "$f")"
          done
      - name: apt-get update
        run: |
          opts=""
          [ "${{ matrix.mode }}" = pdiffs-off ] && opts="-o Acquire::PDiffs=false"
          if [ "${{ matrix.mode }}" = fresh-lists ]; then sudo apt-get update -qq >/dev/null; fi
          s=$(date +%s.%N)
          sudo apt-get update $opts 2>&1 | tail -3
          e=$(date +%s.%N)
          echo "RESULT mode=${{ matrix.mode }} rep=${{ matrix.rep }} seconds=$(echo "$e - $s" | bc)"
      - name: install (benchmark packages)
        run: |
          s=$(date +%s.%N)
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sysbench fio >/dev/null
          e=$(date +%s.%N)
          echo "RESULT_INSTALL mode=${{ matrix.mode }} rep=${{ matrix.rep }} seconds=$(echo "$e - $s" | bc)"
