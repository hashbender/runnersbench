name: apt probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: luxor-ubuntu-medium-4c-8g
    steps:
      - name: Apt config
        run: |
          cat /etc/apt/sources.list.d/microsoft-prod.list || true
          apt-config dump | grep -iE "Pipeline|No-Cache|Languages|PDiffs|DEP-11|Retries|Timeout|Proxy" || true
          ls -la --time-style=full-iso /var/cache/apt/ || true
      - name: Time apt-get update variants
        run: |
          t() { local s=$(date +%s%N); "$@" >/tmp/out 2>&1; local rc=$?; echo "$(( ($(date +%s%N)-s)/1000000 )) ms rc=$rc : $*"; }
          sudo cp -a /var/lib/apt/lists /tmp/lists.orig
          t sudo apt-get update -qq
          sudo grep -E "^(Get|Hit|Ign|Err)" /tmp/out | head -5 || true
          sudo apt-get update -o Debug::Acquire::http=false 2>&1 | grep -E "^(Get|Hit|Ign|Err|Fetched)" | sed 's/\[.*//' | head -60
          echo "== update 2 (fresh lists)"; t sudo apt-get update -qq
          echo "== without microsoft repo"; sudo mv /etc/apt/sources.list.d/microsoft-prod.list /tmp/; t sudo apt-get update -qq
          echo "== restore original lists, without microsoft"; sudo rm -rf /var/lib/apt/lists && sudo cp -a /tmp/lists.orig /var/lib/apt/lists; t sudo apt-get update -qq
          echo "== restore original lists, with microsoft"; sudo mv /tmp/microsoft-prod.list /etc/apt/sources.list.d/; sudo rm -rf /var/lib/apt/lists && sudo cp -a /tmp/lists.orig /var/lib/apt/lists; t sudo apt-get update -qq
          echo "== install"; t sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sysbench fio build-essential
